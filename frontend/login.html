<style>
*{box-sizing:border-box}
:root{--acento:#4DC0D9;--acento-2:#1A68A8;--cond:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;
  background:radial-gradient(1100px 600px at 15% -10%,rgba(77,192,217,.22),transparent 60%),radial-gradient(900px 560px at 100% 110%,rgba(26,104,168,.35),transparent 60%),linear-gradient(160deg,#0A2540 0%,#071A2E 100%);
  color:#E8F0F8;font:15px/1.45 "IBM Plex Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.tarjeta{width:min(420px,100%);background:#FFFFFF;color:#0F2440;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tarjeta::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--acento-2),var(--acento))}
.cab{text-align:center;padding:26px 28px 6px}
.cab img{height:104px;width:auto;display:block;margin:0 auto 14px}
.eyebrow{font:600 11px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--acento-2)}
h1{margin:4px 0 2px;font:700 26px/1.15 var(--cond);color:#0A2540}
.sub{margin:0;color:#56697F;font-size:14px}
form{padding:12px 28px 26px}
label{display:block;font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;color:#334A66;margin:14px 0 6px}
input{width:100%;min-height:48px;border:1px solid #C8D4E1;border-radius:8px;padding:0 14px;font:inherit;background:#F5F8FB;color:#0F2440}
input:focus{background:#fff;border-color:var(--acento-2)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
button{width:100%;min-height:52px;margin-top:20px;border:0;border-radius:8px;background:linear-gradient(90deg,#0A2540,#1A68A8);color:#fff;font:600 17px var(--cond);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 12px rgba(10,37,64,.3)}
button:hover:not([disabled]){filter:brightness(1.12)}
button[disabled]{opacity:.6;cursor:default}
.err{color:#B3202E;margin:12px 0 0;font-size:14px;min-height:20px}
small{display:block;margin-top:12px;color:#7B8DA3;font-size:12px;text-align:center}
.creditos{text-align:center;color:#9DB6D0;font-size:13px}
.creditos span{display:block;font:600 10px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--acento);margin-bottom:4px}
.creditos b{font:600 16px var(--cond);color:#E8F0F8;letter-spacing:.02em}
.creditos i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--acento);margin:0 11px;vertical-align:middle}
.creditos p{margin:8px 0 0;font-size:12px}
</style>
</head>

    <h1>Banda de monitoreo IoT</h1>
    <p class="sub">Acceso al panel de control</p>
  </div>
  <form id="f">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" autocomplete="username" required autofocus>
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button id="btn" type="submit">Ingresar</button>
    <small>La sesión dura 8 horas y se cierra al cerrar la pestaña.</small>
  </form>
</div>
<div class="creditos">
  <span>Desarrollado por</span>

</div>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario: document.getElementById('usuario').value, clave: document.getElementById('clave').value })
  }).then(r => r.json().then(j => ({ ok: r.ok, j })))
    .then(({ ok, j }) => {
      if (!ok) throw new Error(j.error || 'No se pudo ingresar');
      try { sessionStorage.setItem('jwt', j.token); } catch (e) {}
      location.replace('/');
    })
    .catch(e => { err.textContent = e.message; btn.disabled = false; });
});
</script>
